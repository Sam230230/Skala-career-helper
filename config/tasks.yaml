# =====================================================================
# SKALA 취업 컨설팅 지원 자동화 플랫폼 - Task 정의
# 배치 경로: src/<project>/config/tasks.yaml
#
# ⚠️ 주의: CrewAI는 description/expected_output을 문자열 포맷팅으로 보간합니다.
#          따라서 본문에 JSON 중괄호를 그대로 쓰면 KeyError가 발생합니다.
#          출력 스키마는 코드에서 output_pydantic 으로 강제하고,
#          여기서는 필드를 '불릿'으로만 서술합니다.
#
# 사용 placeholder: {trainee_id} {trainee_name} {desired_job}
#                   {cover_letter} {resume} {portfolio}
# =====================================================================

analyze_documents_task:
  description: >
    아래 SKALA 교육생 1명의 취업 서류 원문을 분석하라.

    <지원자정보>
    식별자: {trainee_id}
    이름: {trainee_name}
    희망 진로(선택 입력, 미입력 시 "없음"): {desired_job}
    </지원자정보>

    <자기소개서>
    {cover_letter}
    </자기소개서>

    <이력서>
    {resume}
    </이력서>

    <포트폴리오>
    {portfolio}
    </포트폴리오>

    [분석 절차 — 아래 순서대로 내부적으로 사고한 뒤, 최종 결과물만 출력하라]
    1단계 (정보 정규화): 세 문서에 흩어진 정보를 학력/전공, 경력·프로젝트, 기술스택,
       자격증·어학, 수상·활동 항목으로 재배열한다. 문서 간 내용이 충돌하면 이력서를 우선한다.
    2단계 (키워드 추출): 핵심 역량을 아래 기준으로 분리해 추출한다.
       - Hard Skill: 언어, 프레임워크, DB, 클라우드, 개발 도구, 직무·도메인 전문기술.
         tech_keywords에 기록한다.
       - Soft Skill: 협업, 소통, 리딩, 문제해결, 책임감, 실행력 등 행동 역량.
         soft_skill_keywords에 기록한다.
       기술명을 Soft Skill에 넣거나 행동 역량을 Hard Skill에 넣지 마라.
       도메인 키워드(금융, 제조, 커머스 등)는 domain_keywords에 별도로 기록한다.
       표기는 표준형으로 정규화한다. 예: "파이썬"→"Python", "스프링부트"→"Spring Boot",
       "AWS EC2/S3"→"AWS". 동일 개념의 중복 표기는 하나로 합친다.
    3단계 (증거 매핑): Hard Skill은 각 항목의 evidence에 원문 근거를 30자 이내로 인용한다.
       Soft Skill은 "역량명 | 행동 근거" 형식으로 soft_skill_keywords에 기록한다.
       근거는 반드시 행동·수치·결과가 드러난 문장이어야 한다.
       "열정적으로 임했다", "최선을 다했다" 같은 태도 표현은 근거로 인정하지 않는다.
    4단계 (요약 작성): 컨설턴트가 처음 보는 지원자를 30초 만에 이해할 수 있도록
       3~5문장의 서술형 요약을 작성한다. 첫 문장은 반드시 "한 줄 정의"로 시작한다.
       (예: "제조 도메인 이해를 갖춘 백엔드 지향 신입 개발자")
    5단계 (강점·공백 진단): 시장가치가 높지만 지원자가 충분히 강조하지 못한 '숨은 강점' 2개와,
       서류만으로는 검증되지 않는 '설명 공백' 2~3개를 지적한다.
    6단계 (희망 진로 처리): 희망 진로가 "없음"이면 서류 근거만으로 가장 개연성 높은 직무를
       추론하고 추론값임을 명시한다. 입력이 있으면 그 직무를 기준으로 삼되,
       서류 근거와 희망 직무의 정합성(높음/보통/낮음)을 반드시 함께 판정한다.

    [준수 규칙]
    - 원문에 없는 경험, 수치, 회사명, 기술을 절대 생성하지 마라. 없으면 "정보 없음"으로 적어라.
    - 포트폴리오가 "없음"으로 입력된 경우 해당 항목을 비우고, 이를 설명 공백에 반영하라.
    - 주관적 평가(우수하다/뛰어나다)를 단독으로 쓰지 말고 반드시 근거와 함께 서술하라.
    - 개인 식별정보(주민번호, 연락처, 상세 주소)는 결과에 절대 포함하지 마라.
    - 모든 출력은 한국어로 작성하라.
  expected_output: >
    ApplicantProfile 스키마를 만족하는 구조화 결과.
    포함 항목은 다음과 같다.
    - 지원자 식별자와 이름
    - 한 줄 정의 (직무 지향성 + 도메인 + 수준이 드러나는 25자 내외 문장)
    - 자기소개서 요약 3~5문장 (서술형, 개조식 금지)
    - Hard Skill 목록인 tech_keywords (각 항목: 키워드명, 숙련추정도[상/중/하], 근거 인용 30자 이내)
    - 도메인 키워드 목록
    - Soft Skill 목록인 soft_skill_keywords (각 항목: "역량명 | 행동 근거" 형식)
    - 주요 프로젝트 최대 3건 (각 항목: 프로젝트명, 본인 역할, 사용 기술, 성과/결과)
    - 보유 자격증·어학 목록
    - 숨은 강점 2개 (각각 왜 시장에서 가치 있는지 1문장 설명 포함)
    - 설명 공백 2~3개 (컨설턴트가 상담에서 확인해야 할 항목 형태로 서술)
    - 희망 직무 정보 (입력값 또는 추론값, 추론 여부 플래그, 서류-희망직무 정합성 판정과 사유)

analyze_job_trend_task:
  description: >
    앞 단계에서 산출된 지원자 프로파일을 근거로, 실제 채용시장 데이터를 조사해
    추천 직무와 추천 기업 리스트를 도출하라.
    지원자의 희망 진로 입력값은 "{desired_job}" 이다.

    [조사 절차]
    1단계 (후보 직무 도출): 지원자의 기술·도메인 키워드 조합으로 지원 가능성이 높은
       후보 직무를 3개 선정한다. 희망 진로가 입력되어 있으면 그 직무를 반드시 1순위 후보에
       포함시키되, 정합성이 낮다면 '대안 직무'를 함께 제시한다.
    2단계 (동의어 확장): 각 후보 직무의 채용시장 내 동의어를 함께 검색어에 포함한다.
       예: 백엔드 개발자 / 서버 개발자 / 플랫폼 엔지니어 / Backend Engineer.
    3단계 (공고 조사): 검색 도구로 최근 12개월 국내 채용 공고를 조사한다.
       각 후보 직무에 대해 다음을 확인한다.
       - 산업군별 공고 분포 (금융, 제조, 유통·커머스, IT서비스·SI, 공공, 스타트업 등)
       - 기업 규모별 분포 (대기업, 중견, 중소, 스타트업)
       - 신입·경력무관 채용 비중
       - 공고에서 반복 등장하는 요구 기술 상위 5~8개와 등장 빈도 순위
    4단계 (수요-보유 대조): 3단계의 요구 기술 상위 목록과 지원자 보유 키워드를 비교해
       각 후보 직무의 진입 난이도를 상/중/하로 판정한다.
    5단계 (기업 추천): 후보 직무별로 실제 채용 이력이 확인되는 기업을 5~8개 추천한다.
       기업 선정 시 반드시 지원자 프로파일과의 연결고리(도메인 경험, 사용 기술 일치,
       신입 채용 여부)를 근거로 제시한다.
    6단계 (우선순위화): 후보 직무 3개를 '추천 순위'로 정렬하고 그 이유를 명시한다.
       정렬 기준은 (1) 지원자 역량 적합도, (2) 시장 채용 규모, (3) 신입 진입 가능성 순이다.

    [준수 규칙]
    - 검색으로 확인되지 않은 공고 수·비율을 임의로 창작하지 마라.
      확인 불가한 항목은 "데이터 확인 불가"로 표기하고, 추정치를 쓸 경우 "(추정)"을 병기하라.
    - 각 수치에는 가능한 한 출처(플랫폼명 또는 도메인)를 함께 기재하라.
    - 최근 12개월 이내 정보를 우선하고, 오래된 자료는 채택하지 마라.
    - 추천 기업은 실제 존재하는 기업만 기재하라. 확신이 없으면 목록에서 제외하라.
    - 모든 출력은 한국어로 작성하라.
  expected_output: >
    JobMarketReport 스키마를 만족하는 구조화 결과.
    포함 항목은 다음과 같다.
    - 조사 기준일과 조사에 사용한 검색 플랫폼 목록
    - 추천 직무 3건 (우선순위 순). 각 항목:
      직무명, 검색에 사용한 동의어, 추천 사유 2~3문장, 진입 난이도(상/중/하),
      최근 12개월 공고 규모(수치 또는 "확인 불가"), 신입 채용 비중,
      해당 직무 요구 기술 상위 5~8개(빈도 순위 포함), 지원자 보유/미보유 표시
    - 산업군별 공고 분포 요약 (산업군명, 비중 또는 공고 수, 비고)
    - 기업 규모별 분포 요약
    - 추천 기업 목록 5~8개 (각 항목: 기업명, 산업군, 채용 중인 직무, 추천 근거 1~2문장,
      신입 지원 가능 여부, 확인 출처)
    - 시장 관점 한 줄 코멘트 (컨설턴트가 상담에서 그대로 말할 수 있는 문장)

hr_fit_review_task:
  description: >
    지원자 프로파일과 채용시장 분석 결과를 종합해, 인사담당자 관점의 적합성 검증과
    실행 가이드를 작성하라.

    [검토 절차]
    1단계 (적합도 매트릭스): 1순위 추천 직무의 요구 기술 상위 항목 각각에 대해
       지원자의 보유 상태를 ✅보유 / ⚠️부분보유 / ❌미보유 로 판정하고,
       판정 근거를 프로파일의 인용문으로 제시한다.
    2단계 (적합도 점수): 아래 가중치 루브릭으로 0~100점을 산출하고 계산 근거를 밝힌다.
       - 핵심 기술스택 일치도 40점
       - 직무 관련 프로젝트·실무 경험 30점
       - 도메인 이해도 15점
       - 소프트스킬 및 성장 가능성 15점
       점수 해석: 80점 이상 즉시 지원 권장 / 60~79점 보완 후 지원 / 60점 미만 직무 재설정 검토.
    3단계 (결정적 갭 도출): 합격을 가로막는 갭을 최대 3개로 좁힌다.
       갭은 반드시 "무엇이 없다"가 아니라 "면접관이 어떤 의심을 하게 되는가" 형태로 서술한다.
    4단계 (포트폴리오 보완 제안): 각 갭을 메울 포트폴리오 과제를 3건 제안한다.
       각 과제는 프로젝트 주제, 사용할 기술스택, 최종 산출물(리포지토리/배포URL/문서),
       예상 소요기간(주 단위), 난이도, 해당 과제가 메우는 갭, 면접에서 어필할 포인트를
       모두 포함해야 한다. "OO을 공부하세요" 수준의 막연한 제안은 금지한다.
    5단계 (검증 질문 5개): 지원자 역량의 진위를 확인할 심층 질문 5개를 설계한다.
       유형 배분을 반드시 지킨다.
       - 경험 검증형 2개 (이력서·자소서에 적힌 특정 경험을 깊게 파고드는 질문)
       - 기술 심화형 1개 (보유 기술의 실제 이해 수준을 확인)
       - 문제 해결형 1개 (갈등, 장애, 실패 상황 대처)
       - 직무 적합·지원 동기형 1개 (희망 직무 및 추천 기업 맥락 반영)
       각 질문마다 '질문 의도', '좋은 답변에 반드시 포함되어야 할 체크포인트 2~3개',
       '답변이 부실할 경우 이어서 던질 꼬리질문 1개'를 함께 작성한다.
       질문은 예/아니오로 끝나지 않도록 개방형으로 작성한다.

    [준수 규칙]
    - 앞 단계 결과에 없는 사실을 새로 만들지 마라.
    - 지적은 반드시 개선 방향과 짝지어 제시하라. 비판만 남기지 마라.
    - 지원자의 나이, 성별, 출신 지역, 학교 서열 등 차별적 요소를 평가에 반영하지 마라.
    - 모든 출력은 한국어로 작성하라.
  expected_output: >
    HRFitReview 스키마를 만족하는 구조화 결과.
    포함 항목은 다음과 같다.
    - 평가 대상 직무명
    - 적합도 매트릭스 (요구 역량, 판정 배지, 근거 인용)
    - 적합도 총점(0~100)과 항목별 배점 내역, 점수 해석 등급
    - 결정적 갭 최대 3개 (면접관 관점의 의심 형태로 서술)
    - 포트폴리오 보완 과제 3건 (주제 / 기술스택 / 산출물 / 소요기간 / 난이도 / 대응 갭 /
      면접 어필 포인트)
    - 검증 질문 5개 (질문 유형, 질문 본문, 질문 의도, 좋은 답변 체크포인트, 꼬리질문)
    - 인사담당자 총평 3문장 이내

build_consulting_report_task:
  description: >
    앞선 세 태스크의 결과를 하나의 상담용 마크다운 리포트로 편집하라.
    대상 독자는 상담 시작 3분 전에 이 문서를 처음 여는 SKALA 운영진·매니저다.

    [편집 규칙]
    - 새로운 사실을 추가하거나 앞선 결론을 바꾸지 마라. 재배열과 표현 개선만 수행한다.
    - 문서 최상단에 "30초 요약 카드"를 배치한다. 카드에는 한 줄 정의, 1순위 추천 직무,
      적합도 점수, 오늘 상담에서 반드시 다룰 핵심 이슈 1가지만 담는다.
    - 아래 1~10번 제목의 번호, 순서, 문구를 그대로 유지하고 모두 출력한다.
      1) 30초 요약 카드
      2) 자기소개서 요약
      3) Hard Skill 직무 적합도
      4) Soft Skill 역량 분석
      5) 추천 직무 TOP 3
      6) 채용시장 데이터
      7) 추천 기업 리스트
      8) 포트폴리오 보완 가이드
      9) 상담용 검증 질문 5선
      10) 상담 시 유의사항

    - 3) Hard Skill 직무 적합도에서는 다음 정보를 하나의 섹션으로 통합한다.
      · 지원자의 tech_keywords
      · 1순위 추천 직무의 required_skills
      · HR 검토 결과의 fit_matrix, total_score, score_breakdown, grade, critical_gaps
      별도의 "적합도 진단" 섹션을 만들지 마라.

    - Hard Skill 통합 표는 다음 열을 사용한다.
      Hard Skill | 지원자 숙련도 | 직무 요구 순위 | 판정 | 근거
      · 직무 요구 기술을 우선으로 행을 구성한다.
      · 지원자 숙련도는 tech_keywords의 proficiency를 사용한다.
      · 해당 기술이 tech_keywords에 없으면 숙련도는 "미확인"으로 표시한다.
      · 판정은 fit_matrix의 ✅ 보유 / ⚠️ 부분보유 / ❌ 미보유를 사용한다.
      · 동일하거나 의미가 같은 기술명은 하나의 행으로 통합하고 중복 출력하지 마라.
      · 표 아래에 적합도 총점, 항목별 점수, 등급을 간단히 표시한다.
      · critical_gaps는 "핵심 보완 포인트"로 최대 3개만 제시한다.

    - 4) Soft Skill 역량 분석은 soft_skill_keywords만 사용해 별도 표로 작성한다.
      표 열은 Soft Skill | 행동 근거 로 구성한다.
      "역량명 | 행동 근거" 값을 두 열로 분리하고 Hard Skill이나 적합도 판정을 섞지 마라.

    - 6) 채용시장 데이터는 문장이나 불릿 나열이 아니라 아래 Markdown 표로 정리한다.
      첫 번째 표: 직무 | 최근 12개월 공고 규모 | 신입 채용 비중 | 진입 난이도 | 출처·비고
      · 추천 직무 3개를 각각 한 행으로 작성한다.
      · 수치가 확인되지 않으면 "데이터 확인 불가"로 표시하고 임의로 생성하지 마라.
      두 번째 표: 구분 | 세부 항목 | 비중·공고 수 | 비고
      · industry_distribution과 company_size_distribution을 이 표에 함께 정리한다.
      · 구분 열에는 "산업군" 또는 "기업 규모"를 표시한다.
      · 시장 관점 한 줄 코멘트는 두 표 아래에 1문장으로 작성한다.
    - 5), 7)~10) 섹션은 앞선 분석 결과의 기존 내용과 형식을 유지한다.
    - 상태 표기는 ✅ 보유 / ⚠️ 부분보유 / ❌ 미보유 배지를 사용한다.
    - 표는 3~6열을 넘기지 않는다. 한 셀에 두 줄 이상 쓰지 않는다.
    - 데이터 확인 불가 항목은 숨기지 말고 10) 섹션에 모아 명시한다.
    - 전체 분량은 A4 2~3장 수준으로 유지하고 중복 문장을 제거한다.
    - 모든 출력은 한국어로 작성한다.
